# Shared on-premise development stack. See docs/deployment-development.md for
# the design this file implements — read that first; this file follows it,
# it does not redesign it.
#
# Run from the repo root (paths below and .env.example are root-relative):
#
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --build
#
# `--env-file .env` is explicit rather than relied-upon-by-default:
# Compose's default `.env` lookup is relative to the compose file's
# directory (infra/), not the repo root, and docs/deployment-development.md
# is explicit that the committed template is `.env.example` at the repo
# root. Passing --env-file avoids that mismatch entirely rather than
# depending on --project-directory behaving as expected across Compose
# versions.
#
# The explicit `-f infra/docker-compose.yml` also disables Compose's
# automatic `docker-compose.override.yml` discovery (that discovery only
# fires for the default, no-`-f`, current-directory lookup). That is
# load-bearing today — every invocation in this repo (this file, the deploy
# workflow, dev-reset.sh) is `-f`'d and none expects an override file to be
# merged in — but it is currently incidental rather than a documented
# contract. If a per-developer override file is ever introduced, it will
# need to be passed explicitly with its own `-f`.
#
# LAN-only, plain HTTP, synthetic data only (docs/deployment-development.md
# "What this environment deliberately does not do"). Nothing here may ever
# hold a production credential or real PHI — see CLAUDE.md and
# docs/security-hipaa.md.
#
# NOT a staging starting point. There is no hardening, no TLS, no secrets
# manager, `NODE_ENV: development` on the API, MinIO root credentials doing
# double duty as the API's object-storage credentials, and (until the nginx
# placeholders are replaced at P2.S3) containers running as root — see
# docs/deployment-development.md "What this environment deliberately does
# not do" for the full deferred-risk list staging must independently verify.
# Copying this file forward and hardening it in place is not the plan.

name: ostomy-dev

networks:
  ostomy-dev:
    name: ostomy-dev

volumes:
  pgdata:
  miniodata:

# Shared build context/dockerfile for both `api` and `migrate` below — they
# build from the SAME Dockerfile but at two different, divergent stages
# (infra/docker/api.Dockerfile: `runtime` vs `migrate`), so each service
# overrides `build.target` (and `image`, to avoid two unrelated images
# fighting over one tag) explicitly rather than relying on this anchor's
# defaults. YAML's `<<` merge key only merges top-level keys of the mapping
# it's spread into; a key given explicitly in the service itself (`build:`,
# `image:`) replaces the anchor's version of that key wholesale rather than
# deep-merging into it — so each override below repeats `context`/
# `dockerfile`, it does not just add `target`.
x-api-image: &api-image
  build:
    context: ..
    dockerfile: infra/docker/api.Dockerfile
    target: runtime
  image: ostomy/api:dev-latest

# Bounded log rotation, not a PHI control: the default `json-file` driver
# would otherwise grow without limit, and docs/deployment-development.md
# "Host baseline" flags a full disk as the most likely way this environment
# breaks. What ends up *in* those logs — never PHI — is enforced by the
# API's own Pino redaction (docs/security-hipaa.md "Never log PHI"); this
# only bounds how much of it is kept.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    container_name: ostomy-dev-postgres
    restart: unless-stopped
    logging: *default-logging
    # `-c log_error_verbosity=terse` (P1.S3 review response, B2): as of
    # P1.S3 this container hosts real PHI tables and CHECK constraints —
    # the comment two lines below ("there is none [PHI] in this container")
    # was true before this sprint and is false now, and this flag is what
    # keeps it true again. Verified empirically: with the default verbosity
    # (or `default`/`verbose`), a CHECK violation writes a `DETAIL:` line to
    # this container's stdout (and therefore the `json-file` log driver
    # above) containing the full failing row, e.g.
    # `Failing row contains (…, p1, Observation, 79560-9, -500.2500, mL, …)`
    # — clinical values and all. `terse` suppresses that `DETAIL:` line
    # entirely (the error itself, and the offending `STATEMENT:` text
    # sent over the wire, are unaffected — an application issuing
    # non-parameterized SQL with a literal clinical value embedded in the
    # query text would still leak it via `STATEMENT:`; this API always
    # sends parameterized queries through Prisma, so that residual path is
    # not currently reachable, but it is a property of how queries are
    # issued, not of this flag). This is a development-stack mitigation
    # only — see docs/deployment-development.md "Database lifecycle" for
    # the equivalent RDS parameter-group requirement staging/production
    # must set independently; nothing here configures RDS.
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    environment:
      # `:?` (Compose's required-variable syntax), not `:-`: an unset value
      # here becomes an empty string, not an absent one, and an empty
      # POSTGRES_PASSWORD is a real, silent way to end up with a
      # passwordless superuser. See .env.example.
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ostomy-dev
    # Postgres stays off the LAN by default (docs/deployment-development.md
    # "Network and access"). Uncomment only to point a GUI client at it
    # temporarily, and revert afterward:
    # ports:
    #   - "${DEV_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Postgres's own server log is operational noise, not application-level
    # PHI logging in the sense the API's Pino redaction
    # (docs/security-hipaa.md "Never log PHI") covers — that redaction is
    # about request/response and audit data passing through the API
    # process, and remains true of it. It is NOT true that this container
    # holds no PHI-shaped data to leak on its own, as of P1.S3: this
    # container's tables now hold real clinical rows, and a CHECK
    # violation's error `DETAIL:` line is exactly that — see the
    # `log_error_verbosity=terse` flag above (B2), which is what keeps this
    # container's own log stream free of it.

  # One-shot: sets the runtime role's LOGIN password, every deploy, AFTER
  # `migrate` and BEFORE `api` ever connects. See infra/db/README.md and
  # ADR-0011 for the full rationale; in short:
  #
  # - `postgres` above bootstraps ${POSTGRES_USER} as a superuser (the
  #   image's own behavior). That role is the "owner" migrations run as.
  # - `migrate` below (running FIRST now — see that service's own comment
  #   on why this service moved after it) creates ${POSTGRES_RUNTIME_USER}
  #   as a NOSUPERUSER/NOCREATEDB/NOCREATEROLE/NOINHERIT/NOREPLICATION
  #   role, NOLOGIN, with every table grant it will ever hold (ADR-0011).
  #   This service does exactly one remaining thing: give that role a
  #   password and LOGIN, so it can actually authenticate — the one part
  #   of role setup that is a secret and therefore CANNOT live in a
  #   committed migration. Without this step ${POSTGRES_RUNTIME_USER}
  #   exists but nothing (including `api`) can connect as it.
  # - Deliberately its own service, not a docker-entrypoint-initdb.d script
  #   mounted on `postgres`: the Postgres image only ever runs initdb.d
  #   scripts once, against an empty data directory. This service re-runs
  #   idempotently every deploy instead (rotating
  #   POSTGRES_RUNTIME_PASSWORD in .env and redeploying is enough on its
  #   own), which also lets it land against the shared host's
  #   ALREADY-provisioned `pgdata` volume without a `dev-reset`.
  db-roles:
    image: postgres:17-alpine
    container_name: ostomy-dev-db-roles
    logging: *default-logging
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - ./db/bootstrap-roles.sql:/bootstrap-roles.sql:ro
    networks:
      - ostomy-dev
    depends_on:
      # Not just `postgres: service_healthy` — the role this script
      # `ALTER`s does not exist until `migrate`'s first migration creates
      # it (P1.S3). Running this before `migrate`, as it did before P1.S3,
      # would now fail outright ("role does not exist") instead of the
      # silent ordering coincidence that used to make it work.
      migrate:
        condition: service_completed_successfully
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -h
      - postgres
      - -U
      - ${POSTGRES_USER:?set in .env}
      - -d
      - ${POSTGRES_DB:?set in .env}
      - -v
      - runtime_role=${POSTGRES_RUNTIME_USER:?set in .env}
      - -v
      - runtime_password=${POSTGRES_RUNTIME_PASSWORD:?set in .env}
      - -f
      - /bootstrap-roles.sql

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: ostomy-dev-minio
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      # Also the API's own S3-compatible credentials today (wired into
      # OBJECT_STORAGE_ACCESS_KEY_ID/SECRET_ACCESS_KEY below) — meaning the
      # LAN-exposed console login and the API's storage credential are
      # currently the same secret. A bucket-scoped service account (via an
      # `mc admin user add` init step, run the same way `db-roles` runs its
      # SQL) would make dev model production's shape more closely; judged
      # out of scope for this pass rather than silently deferred — flag it
      # before P1.S3 adds real objects to the bucket.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - miniodata:/data
    networks:
      - ostomy-dev
    ports:
      # Console only (docs/deployment-development.md "Network and access"
      # table: MinIO API stays compose-network-only; the console is the LAN
      # row). The S3 API port (9000) is reachable from other containers as
      # http://minio:9000 but is intentionally not published to the host.
      # Standalone development against this MinIO from outside Docker (e.g.
      # apps/api/.env.example's OBJECT_STORAGE_ENDPOINT=http://localhost:9000
      # for `pnpm --filter @ostomy/api start:dev` run directly, not
      # containerized) needs 9000 published too — add it temporarily,
      # revert afterward, same as the postgres port above.
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:9001:9001"
    healthcheck:
      # No wget or curl in this image (verified against
      # minio/minio:RELEASE.2025-04-08T15-41-24Z) — only its own `mc` client
      # binary, which ships a purpose-built readiness subcommand.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mock-oidc:
    # navikt/mock-oauth2-server — the choice recorded as an open item in
    # docs/deployment-development.md, settled here. It creates an issuer
    # lazily for any path segment on first request (verified empirically:
    # GET /<any-path>/.well-known/openid-configuration "just works" with no
    # config file), each with its own distinct RSA signing key, so the
    # patient (`patient-issuer`) and admin (`admin-issuer`) paths used by
    # apps/api/.env.example are disjoint issuers with disjoint JWKS by
    # construction — no JSON_CONFIG needed to satisfy SRS_v2 §4.6's
    # two-pool separation. Every token it issues carries `iat`, `exp`,
    # `nbf`, matching the guards' `requiredClaims: ['exp', 'iat']`.
    #
    # Pinned by tag AND digest, not `:latest`: this is the one image whose
    # exact behavior (Host-header-derived `iss`, lazy per-path issuers, 405
    # on HEAD) the DEV_HOST_ADDRESS design below depends on. An unpinned
    # upstream change would break auth on the shared host with a symptom
    # indistinguishable from a DEV_HOST_ADDRESS misconfiguration — re-verify
    # the three behaviors above by hand before ever bumping this pin.
    #
    # IMPORTANT — read before changing DEV_HOST_ADDRESS or issuer URLs:
    # this image derives the `iss` claim from the Host header of whatever
    # request minted the token, not from a fixed config value. See the
    # DEV_HOST_ADDRESS comment in .env.example.
    image: ghcr.io/navikt/mock-oauth2-server:6.0.2@sha256:b538810afd589d42fbfb856c588c2065eaeed1dc528d6c532972048e67fc2aff
    container_name: ostomy-dev-mock-oidc
    restart: unless-stopped
    logging: *default-logging
    environment:
      LOG_LEVEL: INFO
      # Make `aud` the client_id, which is what apps/api checks.
      #
      # WITHOUT this the server issues `aud: "default"` and puts the
      # client_id in `azp` instead — verified by running the real
      # Authorization Code + PKCE flow against the pinned digest above
      # (R.S1). apps/api's guards check `audience` by exact match, so every
      # token this server minted was refused: `/thresholds`, `/sync/delta`
      # and `/value-sets` all returned 401 on a valid signature, and
      # apps/mobile could not load a threshold, sync, or save an entry.
      #
      # apps/mobile/.env.example had recorded the opposite as an ASSUMPTION
      # since P2.S2a — "an issued token's `aud` claim equals the
      # authorization request's `client_id` verbatim" — and asked for it to
      # be verified the first time the app ran against this stack. It was
      # wrong.
      #
      # Fixed HERE rather than by setting OIDC_AUDIENCE=default on the API,
      # which was the other option. The audience check is a real control —
      # it is what stops a token minted for a different client being
      # replayed against this API — so the dev IdP is made to behave like a
      # real one instead of the API being taught to accept a placeholder.
      # It also keeps the patient and admin audiences distinct, which
      # matching on "default" would have collapsed.
      #
      # `interactiveLogin` is REQUIRED, not decorative. Supplying ANY
      # JSON_CONFIG turns it off by default, and with it off the authorize
      # endpoint skips the login form and mints a token with NO `sub`
      # claim — which apps/api rejects as MISSING_SUBJECT_CLAIM: a 401 on a
      # perfectly-signed token with the right issuer and audience. The
      # first version of this config omitted it and blocked Gate B until
      # R.S1 run 3 found it.
      #
      # The mapping matches `grant_type` with a wildcard, NOT `client_id`,
      # because the patient issuer serves TWO clients — the mobile app
      # (`ostomy-patient-app`) and the web SPA (`ostomy-web`) — and both
      # must receive the audience apps/api checks, which is
      # `ostomy-patient-app` for both (see the `web` service's
      # VITE_OIDC_AUDIENCE). Matching on client_id stamps the mobile client
      # only and leaves the web SPA holding `aud: "default"` and the same
      # 401. Each issuer still stamps only its own audience: the callbacks
      # are keyed per `issuerId`.
      JSON_CONFIG: >-
        {
          "interactiveLogin": true,
          "tokenCallbacks": [
            {
              "issuerId": "patient-issuer",
              "requestMappings": [
                {
                  "requestParam": "grant_type",
                  "match": "*",
                  "claims": { "aud": ["ostomy-patient-app"] }
                }
              ]
            },
            {
              "issuerId": "admin-issuer",
              "requestMappings": [
                {
                  "requestParam": "grant_type",
                  "match": "*",
                  "claims": { "aud": ["ostomy-admin-console"] }
                }
              ]
            }
          ]
        }
    networks:
      - ostomy-dev
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:8090:8080"
    healthcheck:
      # Not `wget --spider`: this server responds 405 to HEAD requests
      # (verified against the pinned digest above), which is what --spider
      # sends — a real GET is required. Probes /patient-issuer/ rather than
      # /default/ because /patient-issuer/ and /admin-issuer/ are the
      # issuers actually in use (apps/api/.env.example); /default/ proves
      # only that the server is up, not that the issuer paths this stack
      # depends on work.
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=-",
          "http://localhost:8080/patient-issuer/.well-known/openid-configuration",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: must exit 0 before `db-roles` (and, transitively, `api`) starts
  # (docs/deployment-development.md "Database lifecycle"). Run as a separate
  # service, never in the API's own entrypoint, so a future multi-replica
  # `api` can never race two concurrent migration attempts.
  #
  # Runs BEFORE `db-roles` now (P1.S3) — reversed from the pre-P1.S3
  # ordering. The first migration
  # (apps/api/prisma/migrations/20260905000000_init_schema_core) creates the
  # runtime role itself (NOLOGIN, with every grant it will ever hold —
  # ADR-0011); `db-roles` now does one remaining thing, setting that role's
  # password, and it cannot `ALTER` a role that does not exist yet. See that
  # service's comment and infra/db/README.md "The seam for P1.S3".
  #
  # Runs `prisma migrate deploy` directly against this stage's own
  # node_modules (no pnpm invoked at container runtime, in either this
  # stage or `runtime` — see infra/docker/api.Dockerfile's `migrate` stage
  # — so this is `node` invoking the CLI's entry file, not `pnpm exec
  # prisma`). Idempotent by design: a second run against an
  # already-migrated database is a no-op, which is what makes this safe to
  # run twice per `docker compose up -d` deploy (the deploy workflow's
  # explicit `run --rm migrate` step removes its own container on exit, so
  # `up -d` immediately after starts a second one to satisfy its own
  # `service_completed_successfully` condition).
  migrate:
    <<: *api-image
    # Overrides the anchor's `build`/`image` wholesale (see x-api-image's own
    # comment on why a merge key can't just add `target` on top): this is
    # infra/docker/api.Dockerfile's `migrate` stage, not `runtime` — it needs
    # `prisma` (the CLI) and `dotenv`, which are devDependencies precisely so
    # `runtime`'s `pnpm deploy --prod` excludes them (CI-audit follow-up to
    # P1.S3 — see apps/api/package.json's own comment). A distinct image tag
    # keeps this from fighting `api`'s `ostomy/api:dev-latest` tag over which
    # build last claimed it — these are two different images now, not one
    # image built twice.
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: migrate
    image: ostomy/api-migrate:dev-latest
    container_name: ostomy-dev-migrate
    logging: *default-logging
    environment:
      # The owner DSN — connects as ${POSTGRES_USER}, a superuser, precisely
      # because migrations need to create and alter tables, roles, and
      # grants (ADR-0011). See infra/db/README.md.
      #
      # Named MIGRATION_DATABASE_URL, not DATABASE_URL (S12, P1.S3 review
      # response) — see apps/api/prisma.config.ts's own comment on this
      # variable for why: the `api` service below (and
      # apps/api/src/config/env.schema.ts) reads `DATABASE_URL` for the
      # RUNTIME role's DSN, and giving both DSNs the same variable name
      # would let a root `.env` used for `pnpm --filter @ostomy/api
      # start:dev` silently run the whole API as the schema owner if it
      # ever held the owner DSN under that name for local CLI convenience.
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
    command:
      - "node"
      - "node_modules/prisma/build/index.js"
      - "migrate"
      - "deploy"
    networks:
      - ostomy-dev
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-image
    container_name: ostomy-dev-api
    restart: unless-stopped
    logging: *default-logging
    # Swagger UI + openapi.json are gated on `NODE_ENV !== 'production'`
    # (see apps/api/src/main.ts). Deliberately left on for this LAN,
    # synthetic-data-only host — there is no PHI for it to expose, and it is
    # the only place to browse the API surface before apps/web exists.
    environment:
      NODE_ENV: development
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OIDC_CLOCK_TOLERANCE_SECONDS: ${OIDC_CLOCK_TOLERANCE_SECONDS:-30}

      # Browser origins allowed to read responses from this API.
      #
      # apps/web is served from a DIFFERENT origin than this API — 8088 vs
      # 3000 here, S3+CloudFront vs the load balancer in production — so
      # without this the browser discards every response while this API's
      # access log shows 200. That combination blocked Gate B clause 6 and
      # is deliberately hard to read from either side alone.
      #
      # Both SPA origins are listed, and that does NOT collapse the
      # admin/patient boundary: SRS_v2 §4.6 puts that boundary in the two
      # disjoint identity pools and the structurally separate guards, so a
      # patient token still cannot reach /api/v1/admin/... from either
      # origin. There is no wildcard and no way to configure one.
      CORS_ALLOWED_ORIGINS: http://${DEV_HOST_ADDRESS:?set in .env - see .env.example}:8088,http://${DEV_HOST_ADDRESS:?set in .env - see .env.example}:8081

      # The runtime DSN — connects as ${POSTGRES_RUNTIME_USER}, the role
      # `migrate`'s first migration creates (NOSUPERUSER/NOCREATEDB/
      # NOCREATEROLE/NOINHERIT/NOREPLICATION) and `db-roles` gives a
      # password to. Validated at boot by apps/api/src/config/load-config.ts
      # (P1.S3) even though `PrismaService` is not part of `AppModule`'s
      # graph yet — see that file's own comment on why. Present so the API
      # never has the option of accidentally connecting as the migration
      # owner once a consumer does exist. See infra/db/README.md.
      DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:?set in .env}:${POSTGRES_RUNTIME_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}

      # Patient OIDC. JWKS_URI uses compose-internal DNS: the JWKS content
      # mock-oauth2-server serves for a given issuer path is independent of
      # the Host header used to fetch it (verified empirically), so this is
      # safe even though ISSUER below must be reachable at DEV_HOST_ADDRESS.
      OIDC_ISSUER: http://${DEV_HOST_ADDRESS:?set in .env - see .env.example, and never leave this as localhost}:8090/patient-issuer
      OIDC_JWKS_URI: http://mock-oidc:8080/patient-issuer/jwks
      OIDC_AUDIENCE: ostomy-patient-app
      OIDC_SUBJECT_CLAIM: sub

      # Admin OIDC — a structurally separate issuer path, never sharing an
      # issuer, audience, or JWKS URI with the patient block above
      # (SRS_v2 §4.6, ADR-0008; apps/api/src/config/load-config.ts rejects
      # startup otherwise).
      ADMIN_OIDC_ISSUER: http://${DEV_HOST_ADDRESS:?set in .env - see .env.example, and never leave this as localhost}:8090/admin-issuer
      ADMIN_OIDC_JWKS_URI: http://mock-oidc:8080/admin-issuer/jwks
      ADMIN_OIDC_AUDIENCE: ostomy-admin-console
      ADMIN_OIDC_SUBJECT_CLAIM: sub

      # Object storage: MinIO stands in for S3. Path-style addressing is
      # mandatory for MinIO (CLAUDE.md "Never assume AWS-hosted S3") — do
      # not change OBJECT_STORAGE_FORCE_PATH_STYLE to "false" here.
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set in .env}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set in .env}
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
    networks:
      - ostomy-dev
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mock-oidc:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Not implied by depending on `migrate` alone (P1.S3): `db-roles` now
      # runs AFTER `migrate` (it sets the password for the role `migrate`
      # creates), so `api` must wait on it explicitly or it can start
      # before the runtime role can actually authenticate.
      db-roles:
        condition: service_completed_successfully
    # The Dockerfile's own HEALTHCHECK (curl against /api/v1/health) is
    # authoritative; not overridden here. It is liveness, not readiness —
    # honest only because apps/api/src/config/load-config.ts fails fast
    # before the listener ever opens, so today "the process is up" and "the
    # process is correctly configured" happen to coincide. Both this
    # healthcheck and the deploy workflow's own HTTP check must repoint at
    # /api/v1/health/ready once P1.S3 gives the API a database connection
    # that can be up-but-unready.

  # The real SPA as of P2.S3 — this was a placeholder image for three sprints
  # after apps/web landed (see infra/docker/web.Dockerfile's own header).
  #
  # Every VITE_* value is a BUILD arg, not runtime environment: Vite inlines
  # them into the bundle, because a browser has no process environment to read.
  # Changing DEV_HOST_ADDRESS therefore requires `docker compose build web`,
  # not a restart — the one operational difference from every other service
  # here, and the thing most likely to produce a SPA quietly talking to the
  # previous address.
  #
  # The issuer and redirect URI must both be reachable AT DEV_HOST_ADDRESS from
  # the browser, and the issuer must match what mock-oauth2-server derives from
  # the Host header of the request that minted the token — see .env.example's
  # DEV_HOST_ADDRESS comment. This is the same constraint the api service's
  # OIDC_ISSUER is under, expressed on the client side.
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: http://${DEV_HOST_ADDRESS:?set in .env - see .env.example, and never leave this as localhost}:3000
        VITE_OIDC_ISSUER: http://${DEV_HOST_ADDRESS:?set in .env - see .env.example}:8090/patient-issuer
        VITE_OIDC_CLIENT_ID: ostomy-web
        VITE_OIDC_AUDIENCE: ostomy-patient-app
        VITE_OIDC_REDIRECT_URI: http://${DEV_HOST_ADDRESS:?set in .env - see .env.example}:${DEV_WEB_PORT:-8080}/
    image: ostomy/web:dev-latest
    container_name: ostomy-dev-web
    restart: unless-stopped
    logging: *default-logging
    networks:
      - ostomy-dev
    ports:
      # Container port 8080, not 80: the runtime stage runs as the non-root
      # `nginx` user and cannot bind a privileged port.
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${DEV_WEB_PORT:-8080}:8080"

  admin:
    build:
      context: ..
      dockerfile: infra/docker/admin.Dockerfile
    image: ostomy/admin:dev-latest
    container_name: ostomy-dev-admin
    restart: unless-stopped
    logging: *default-logging
    networks:
      - ostomy-dev
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:8081:80"
